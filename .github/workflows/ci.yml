name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# This workflow only reads the repository; say so, and the token can do no more.
permissions:
  contents: read

# A new push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      # A matrix is worth having wherever the project claims to run: two runtime
      # versions catch deprecations early, and windows-latest catches the path
      # bugs that never reproduce on a Mac. Drop what does not apply.
      matrix:
        os: [ubuntu-latest]
        version: ["18", "22", "24"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with: { node-version: "${{ matrix.version }}", cache: npm }

      - name: Install dependencies
        run: script/bootstrap

      - name: Lint
        run: script/lint

      - name: Test
        run: script/test

      - name: Build
        run: script/build
