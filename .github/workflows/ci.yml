name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

# This workflow only reads the repository; say so, and the token can do no more.
permissions:
  contents: read

# A new push to the same branch or pull request supersedes the run in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linting is a toolchain concern, not a runtime one — neostandard needs a
  # newer Node than the package does, and running it in the matrix below would
  # fail the oldest supported runtime over a dev dependency.
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with: { node-version: "24", cache: npm }

      - name: Install dependencies
        run: script/bootstrap

      - name: Lint
        run: script/lint

  test:
    strategy:
      fail-fast: false
      # Every runtime the package claims to run on. It touches no filesystem and
      # no paths, so one OS is the whole story.
      matrix:
        os: [ubuntu-latest]
        version: ["18", "20", "22", "24"]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with: { node-version: "${{ matrix.version }}", cache: npm }

      - name: Install dependencies
        run: script/bootstrap

      - name: Test
        run: script/test

      - name: Build
        run: script/build
